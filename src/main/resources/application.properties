# ===== 本地消息消费组件 (localmq) 配置 =====
# 总开关：false 时不装配 LocalMessageBroker Bean
localmq.enabled=true
# 状态快照文件（全量 JSON，原子 rename 落盘）；默认相对工作目录
localmq.state-file=./data/localmq-state.json
# 未显式指定 ConsumerGroupConfig 时的参考默认值（组配置仍以 registerGroup 传入为准）
localmq.default-max-attempts=3
localmq.default-lease-seconds=10
# 指数退避：delay = min(base * multiplier^(n-1) + [0,jitter), max)
localmq.backoff-base-millis=50
localmq.backoff-multiplier=2.0
localmq.backoff-max-millis=5000
localmq.backoff-jitter-millis=25

# ===== 本地幂等消息消费组件配置 =====
# 一条消息允许的总投递次数（含首次）；仍失败则进死信
idempotent-mq.max-attempts=3
# 指数退避：首次失败等待、倍数、上限
idempotent-mq.backoff-initial=100ms
idempotent-mq.backoff-multiplier=2.0
idempotent-mq.backoff-max=10s
# 投递租约：超过该时长未确认的在途消息可被重新投递（宕机/重启恢复）
idempotent-mq.visibility-lease=30s
# 状态文件：配置后启用本地持久化与重启恢复；留空则为纯内存存储
# idempotent-mq.state-file=build/mq/broker-state.json
